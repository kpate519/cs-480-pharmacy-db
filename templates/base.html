<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Pharmacy{% endblock %} | Team 6</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><div class="brand">Pharmacy Database <small>CS 480 · Team 6</small></div><nav aria-label="Main navigation">{% for endpoint, label in [('patients','Patients'),('search','Search'),('report','Staff report'),('new_fill','Add fill')] %}<a href="{{ url_for(endpoint) }}" {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}</nav></header><main>{% block content %}{% endblock %}</main></body></html>
